name: CI

# This workflow is triggered on pushes to the repository.
on: [push, workflow_dispatch]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler_version: [13]
        option_shared: ['shared=True', 'shared=False']
        option_proxyfmu: ['proxyfmu=True', 'proxyfmu=False']
    container:
      image: gcc:${{ matrix.compiler_version }}
    env:
      CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
      CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
      LIBCOSIMC_RUN_TESTS_ON_CONAN_BUILD: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y pipx
          pipx install conan "cmake>=4.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure Conan
        run: |
          conan profile detect
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            --settings="build_type=${{ matrix.build_type }}" \
            --options="libcosimc/*:${{ matrix.option_shared }}" \
            --options="libcosim/*:${{ matrix.option_proxyfmu }}" \
            --build=missing \
            --user=osp \
            --channel="${CHANNEL}" \
            .
      - name: Upload package
        run: |
          conan upload --confirm --remote=osp '*'

  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        build_type: [Debug, Release]
        option_shared: ['shared=True', 'shared=False']
        option_proxyfmu: ['proxyfmu=True', 'proxyfmu=False']
    env:
      CONAN_LOGIN_USERNAME_OSP: ${{ secrets.osp_artifactory_usr }}
      CONAN_PASSWORD_OSP: ${{ secrets.osp_artifactory_pwd }}
      LIBCOSIMC_RUN_TESTS_ON_CONAN_BUILD: 1

    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          pip3 install --upgrade setuptools pip
          pip3 install conan
      - name: Configure Conan
        run: |
          conan profile detect
          conan remote add osp https://osp.jfrog.io/artifactory/api/conan/conan-local --force
      - name: Conan create
        shell: bash
        run: |
          REFNAME="${GITHUB_REF#refs/*/}"
          VERSION="v$(<version.txt)"
          if [[ $GITHUB_REF == refs/tags/* ]] && [[ $REFNAME == $VERSION ]]; then CHANNEL="stable"
          elif [[ $REFNAME == master ]]; then CHANNEL="testing"
          else
            SHORT_REFNAME="${REFNAME:0:40}"
            CHANNEL="testing-${SHORT_REFNAME//\//_}"
          fi
          conan create \
            --settings="build_type=${{ matrix.build_type }}" \
            --options="libcosimc/*:${{ matrix.option_shared }}" \
            --options="libcosim/*:${{ matrix.option_proxyfmu }}" \
            --build=missing \
            --user=osp \
            --channel="${CHANNEL}" \
            .
      - name: Conan upload
        run: conan upload --confirm --remote=osp 'libcosimc/*'
